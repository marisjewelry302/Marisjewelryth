<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Maris Jewelry</title>
  <meta name="description" content="The page you are looking for could not be found. Return to the Maris Jewelry homepage or continue browsing collections.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#00493a">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="apple-touch-icon" href="assets/images/logo.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&family=Urbanist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --maris-teal: #00493a;
      --maris-rose: #dda4a5;
      --maris-paper: #fffaf6;
      --maris-white: #ffffff;
      --maris-ink: #102923;
      --maris-silver: #ececec;
      --maris-gold: #b9933a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top left, rgba(221, 164, 165, 0.28), transparent 28%),
        linear-gradient(180deg, var(--maris-paper) 0%, var(--maris-white) 56%, var(--maris-silver) 100%);
      color: var(--maris-ink);
      font-family: "Urbanist", "Anuphan", sans-serif;
    }

    .not-found-card {
      width: min(680px, 100%);
      padding: 40px 32px;
      text-align: center;
      background: rgba(255, 250, 246, 0.88);
      border: 1px solid rgba(16, 41, 35, 0.08);
      box-shadow: 0 24px 60px rgba(0, 73, 58, 0.12);
    }

    .not-found-card img {
      width: min(220px, 58vw);
      display: block;
      margin: 0 auto -48px;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--maris-gold);
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 6vw, 54px);
      font-weight: 400;
      letter-spacing: -0.03em;
    }

    p {
      max-width: 500px;
      margin: 18px auto 0;
      line-height: 1.75;
      color: rgba(16, 41, 35, 0.76);
    }

    .actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 30px;
    }

    .actions a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 0 20px;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: transform 0.2s ease, background 0.2s ease, color 0.2s ease;
    }

    .primary {
      background: var(--maris-teal);
      color: var(--maris-white);
    }

    .secondary {
      border: 1px solid rgba(16, 41, 35, 0.16);
      color: var(--maris-ink);
      background: transparent;
    }

    .actions a:hover {
      transform: translateY(-2px);
    }

    .primary:hover {
      background: #0a5e4b;
    }

    .secondary:hover {
      background: rgba(221, 164, 165, 0.18);
    }

    @media (max-width: 768px) {
      .not-found-card {
        padding: 32px 20px;
      }

      .not-found-card img {
        margin-bottom: -28px;
      }
    }
  </style>
</head>
<body class="not-found-page">
  <main class="not-found-card">
    <img src="assets/images/logo.png" alt="Maris Jewelry Logo">
    <p class="eyebrow">404</p>
    <h1>Page not found</h1>
    <p>The page you opened is not available right now. You can return to the homepage or continue browsing the main collections.</p>
    <div class="actions">
      <a class="primary" href="index.html">Back to Home</a>
      <a class="secondary" href="pages/engagement-ring.html">View Collections</a>
    </div>
  </main>
  <script src="assets/js/footer.js"></script>
</body>
</html>
